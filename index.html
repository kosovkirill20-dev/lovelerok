<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приглашение на свидание ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(145deg, #0b0c2e 0%, #1a1a4e 40%, #2d1b69 100%);
            overflow: hidden;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        .floating-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .heart-float {
            position: absolute;
            font-size: 28px;
            animation: floatUp linear infinite;
            opacity: 0.6;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) rotate(0deg) scale(0.5); opacity: 0.8; }
            100% { transform: translateY(-10vh) rotate(720deg) scale(1.2); opacity: 0; }
        }

        .card {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 50px 40px 40px;
            max-width: 520px;
            width: 92%;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 0 0 120px rgba(255, 100, 200, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.15);
            text-align: center;
            transition: 0.3s;
        }

        .emoji-big {
            font-size: 64px;
            margin-bottom: 8px;
            display: block;
        }

        h1 {
            color: #fff;
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: 0.3px;
            text-shadow: 0 0 30px rgba(255, 100, 200, 0.3);
        }

        .sub {
            color: rgba(255, 255, 255, 0.7);
            font-size: 16px;
            margin-bottom: 28px;
            letter-spacing: 0.5px;
        }

        .sub span {
            color: #ff6b9d;
            font-weight: 600;
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .btn-yes {
            background: linear-gradient(135deg, #ff3b7f, #ff6b9d);
            border: none;
            padding: 16px 36px;
            border-radius: 60px;
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            cursor: pointer;
            box-shadow: 0 8px 30px rgba(255, 60, 130, 0.4);
            transition: 0.25s;
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: 0.5px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            position: relative;
        }

        .btn-yes:hover {
            transform: scale(1.06);
            box-shadow: 0 12px 45px rgba(255, 60, 130, 0.6);
        }

        .btn-yes .heart-icon {
            font-size: 28px;
            animation: pulseHeart 1.4s ease-in-out infinite;
        }

        @keyframes pulseHeart {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.25); }
        }

        .btn-no {
            background: rgba(255, 255, 255, 0.07);
            border: 2px solid rgba(255, 255, 255, 0.2);
            padding: 14px 30px;
            border-radius: 60px;
            font-size: 18px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            transition: 0.15s;
            backdrop-filter: blur(4px);
            position: relative;
            letter-spacing: 0.3px;
        }

        .btn-no:hover {
            background: rgba(255, 80, 80, 0.15);
            border-color: #ff6b6b;
            color: #ff6b6b;
        }

        .btn-no .run-emoji {
            display: inline-block;
            transition: 0.2s;
        }

        .btn-no:hover .run-emoji {
            animation: run 0.5s ease-in-out infinite alternate;
        }

        @keyframes run {
            0% { transform: translateX(0) rotate(0deg); }
            100% { transform: translateX(8px) rotate(-10deg); }
        }

        .form-group {
            margin-top: 12px;
            text-align: left;
        }

        .form-group label {
            color: rgba(255, 255, 255, 0.75);
            font-size: 14px;
            font-weight: 500;
            display: block;
            margin-bottom: 5px;
            letter-spacing: 0.3px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(6px);
            color: #fff;
            font-size: 15px;
            transition: 0.25s;
            outline: none;
            font-family: inherit;
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #ff6b9d;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 25px rgba(255, 60, 130, 0.15);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }

        .btn-send {
            width: 100%;
            margin-top: 16px;
            padding: 14px;
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            border: none;
            border-radius: 30px;
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 6px 25px rgba(124, 58, 237, 0.35);
            letter-spacing: 0.5px;
        }

        .btn-send:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 40px rgba(124, 58, 237, 0.5);
        }

        .btn-send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .success-msg {
            display: none;
            color: #a7f3d0;
            background: rgba(16, 185, 129, 0.15);
            padding: 12px;
            border-radius: 16px;
            margin-top: 14px;
            border: 1px solid rgba(16, 185, 129, 0.25);
            font-weight: 500;
            font-size: 15px;
        }

        .success-msg.show {
            display: block;
        }

        .error-msg {
            display: none;
            color: #fca5a5;
            background: rgba(239, 68, 68, 0.15);
            padding: 12px;
            border-radius: 16px;
            margin-top: 14px;
            border: 1px solid rgba(239, 68, 68, 0.25);
            font-weight: 500;
            font-size: 15px;
        }

        .error-msg.show {
            display: block;
        }

        .hidden {
            display: none !important;
        }

        .answer-text {
            color: #fff;
            font-size: 22px;
            font-weight: 700;
            margin-top: 12px;
            padding: 12px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .answer-text .yes-color {
            color: #ff6b9d;
        }

        .answer-text .no-color {
            color: #ff6b6b;
        }

        @media (max-width: 480px) {
            .card { padding: 30px 20px; }
            h1 { font-size: 22px; }
            .btn-yes { font-size: 17px; padding: 14px 24px; }
            .btn-no { font-size: 15px; padding: 12px 20px; }
            .buttons { gap: 16px; }
        }
    </style>
</head>
<body>

    <div class="stars" id="stars"></div>
    <div class="floating-hearts" id="floatingHearts"></div>

    <div class="card">
        <span class="emoji-big">🌹</span>
        <h1>Приглашение на свидание</h1>
        <p class="sub">
            <span>❤️</span> Ты - самое красивое, что есть в этом мире <span>❤️</span>
        </p>

        <div class="buttons">
            <button class="btn-yes" id="yesBtn">
                <span class="heart-icon">❤️</span> ДА!
            </button>
            <button class="btn-no" id="noBtn">
                <span class="run-emoji">🏃‍♂️</span> Нет
            </button>
        </div>

        <div id="answerBlock" class="hidden">
            <div class="answer-text" id="answerText"></div>
        </div>

        <div id="formBlock" class="hidden">
            <div class="form-group">
                <label>📅 Выбери дату</label>
                <input type="date" id="dateInput" min="2026-08-02" value="2026-08-14">
            </div>

            <div class="form-group">
                <label>💬 Твоё пожелание (что хочешь на свидании?)</label>
                <textarea id="wishInput" placeholder="Например: хочу мороженое и обнимашки 🍦"></textarea>
            </div>

            <button class="btn-send" id="sendBtn">💌 Отправить ответ</button>

            <div class="success-msg" id="successMsg">✅ Отправлено! Она уже знает ❤️</div>
            <div class="error-msg" id="errorMsg">❌ Ошибка. Попробуй ещё раз.</div>
        </div>
    </div>

    <script>
        (function createStars() {
            const container = document.getElementById('stars');
            for (let i = 0; i < 120; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 3 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.setProperty('--duration', (Math.random() * 2 + 1.5) + 's');
                star.style.animationDelay = Math.random() * 3 + 's';
                container.appendChild(star);
            }
        })();

        (function createHearts() {
            const container = document.getElementById('floatingHearts');
            const emojis = ['❤️', '💖', '💗', '✨', '🌸', '💕', '🌺'];
            for (let i = 0; i < 18; i++) {
                const el = document.createElement('div');
                el.className = 'heart-float';
                el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                el.style.left = Math.random() * 100 + '%';
                el.style.fontSize = (Math.random() * 22 + 16) + 'px';
                el.style.animationDuration = (Math.random() * 12 + 10) + 's';
                el.style.animationDelay = (Math.random() * 14) + 's';
                container.appendChild(el);
            }
        })();

        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const answerBlock = document.getElementById('answerBlock');
        const answerText = document.getElementById('answerText');
        const formBlock = document.getElementById('formBlock');
        const dateInput = document.getElementById('dateInput');
        const wishInput = document.getElementById('wishInput');
        const sendBtn = document.getElementById('sendBtn');
        const successMsg = document.getElementById('successMsg');
        const errorMsg = document.getElementById('errorMsg');
        const card = document.querySelector('.card');

        let userAnswer = '';

        noBtn.addEventListener('mouseenter', function(e) {
            const cardRect = card.getBoundingClientRect();
            const btnRect = this.getBoundingClientRect();

            const maxX = cardRect.width - btnRect.width - 10;
            const maxY = cardRect.height - btnRect.height - 10;

            let newX = Math.random() * maxX;
            let newY = Math.random() * maxY;

            newX = Math.max(0, Math.min(newX, maxX));
            newY = Math.max(0, Math.min(newY, maxY));

            this.style.position = 'relative';
            this.style.left = newX + 'px';
            this.style.top = newY + 'px';
            this.style.transition = 'left 0.2s ease, top 0.2s ease';
        });

        function showForm(answer) {
            userAnswer = answer;
            answerBlock.classList.remove('hidden');
            formBlock.classList.remove('hidden');

            if (answer === 'ДА') {
                answerText.innerHTML = '❤️ Ты сказала <span class="yes-color">ДА!</span> 🥰';
            } else {
                answerText.innerHTML = '😢 Ты сказала <span class="no-color">НЕТ...</span> 😢';
            }

            yesBtn.style.display = 'none';
            noBtn.style.display = 'none';
        }

        yesBtn.addEventListener('click', function() {
            showForm('ДА');
        });

        noBtn.addEventListener('click', function() {
            showForm('НЕТ');
        });

        const BOT_TOKEN = '8738638044:AAEorueYrYHPMIONK4d1uSbUm411j1TtzHs';
        const CHAT_ID = '2114555897';

        async function sendToTelegram(answer, date, wish) {
            const text = `
        🥰 НОВЫЙ ОТВЕТ НА ПРИГЛАШЕНИЕ!

        📌 Ответ: ${answer}
        📅 Дата: ${date || 'Не выбрана'}
        💬 Пожелание: ${wish || 'Не указано'}

        🌹 Пусть любовь победит!
            `;

            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;

            try {
                sendBtn.disabled = true;
                sendBtn.textContent = '⏳ Отправка...';
                successMsg.classList.remove('show');
                errorMsg.classList.remove('show');

                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: text,
                        parse_mode: 'HTML'
                    })
                });

                const data = await res.json();

                if (data.ok) {
                    successMsg.textContent = '✅ Отправлено! Она уже знает ❤️';
                    successMsg.classList.add('show');
                    sendBtn.textContent = '💌 Отправлено!';
                    sendBtn.disabled = false;
                } else {
                    errorMsg.textContent = '❌ Ошибка отправки. Попробуй ещё раз.';
                    errorMsg.classList.add('show');
                    sendBtn.textContent = '💌 Отправить ответ';
                    sendBtn.disabled = false;
                }
            } catch (err) {
                errorMsg.textContent = '❌ Ошибка сети. Проверь интернет.';
                errorMsg.classList.add('show');
                sendBtn.textContent = '💌 Отправить ответ';
                sendBtn.disabled = false;
            }
        }

        sendBtn.addEventListener('click', function() {
            const date = dateInput.value;
            const wish = wishInput.value || 'Не указано';
            sendToTelegram(userAnswer, date, wish);
        });
    </script>

</body>
</html>
